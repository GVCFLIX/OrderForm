<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Order Form</title>
</head>
<body>
  <h2>Place Your Order</h2>
  <form id="orderForm">
    <label>Name: <input type="text" name="name" required></label><br><br>
    <label>Phone: <input type="text" name="phone" required></label><br><br>
    <label>Address: <input type="text" name="address" required></label><br><br>
    <label>Message: <textarea name="message"></textarea></label><br><br>
    <button type="submit">Submit</button>
  </form>

  <h3 id="responseMessage" style="color: green;"></h3>


<!-- Order Tracking Section Start  -->
  <hr>
<h3>Track Your Order</h3>
<label>Order Code: <input type="text" id="trackCode" placeholder="e.g., BC-ORD202505011520"></label>
<button onclick="trackOrder()">Track Order</button>

<div id="trackingResult" style="margin-top: 1em; color: blue;"></div>

<!--   Order Tracking Section End  -->
  

  <script>
  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const url = "https://script.google.com/macros/s/AKfycbwnaxSZE8CP51nccfmPQrmeK29Rumnw-1HJgIdlC95Yy-YzSj6WN57eHpG_mLTvl3y8Bg/exec"; // Replace with your actual Apps Script Web App URL

    fetch(url, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        document.getElementById('responseMessage').innerText = `Order submitted! Your code is: ${data.orderCode}`;
        document.getElementById('orderForm').reset();
      } else {
        document.getElementById('responseMessage').innerText = 'Something went wrong.';
      }
    })
    .catch(error => {
      document.getElementById('responseMessage').innerText = 'Error submitting order. Please try again.';
      console.error(error);
    });
  });

    
      // const url = "https://script.google.com/macros/s/AKfycbwnaxSZE8CP51nccfmPQrmeK29Rumnw-1HJgIdlC95Yy-YzSj6WN57eHpG_mLTvl3y8Bg/exec"; // Replace with your deployed Google Apps Script URL
// Order Tracking System 

    function trackOrder() {
    const orderCode = document.getElementById("trackCode").value.trim();
    const url = "https://script.google.com/macros/s/AKfycbwnaxSZE8CP51nccfmPQrmeK29Rumnw-1HJgIdlC95Yy-YzSj6WN57eHpG_mLTvl3y8Bg/exec" + "?orderCode=" + encodeURIComponent(orderCode);

    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          document.getElementById('trackingResult').innerText = "Order not found.";
        } else {
          document.getElementById('trackingResult').innerHTML = `
            <strong>Order Code:</strong> ${data.orderCode}<br>
            <strong>Name:</strong> ${data.name}<br>
            <strong>Phone:</strong> ${data.phone}<br>
            <strong>Address:</strong> ${data.address}<br>
            <strong>Message:</strong> ${data.message}<br>
            <strong>Ordered At:</strong> ${data.timestamp}
          `;
        }
      })
      .catch(err => {
        document.getElementById('trackingResult').innerText = "Error checking order.";
        console.error(err);
      });
  }

  </script>
</body>
</html>
