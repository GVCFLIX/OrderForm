<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Order Form</title>
</head>
<body>
  <h2>Place Your Order</h2>
  <form id="orderForm">
    <label>Name: <input type="text" name="name" required></label><br><br>
    <label>Phone: <input type="text" name="phone" required></label><br><br>
    <label>Address: <input type="text" name="address" required></label><br><br>
    <label>Message: <textarea name="message"></textarea></label><br><br>
    <button type="submit">Submit</button>
  </form>

  <h3 id="responseMessage" style="color: green;"></h3>

  <script>
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = new FormData(this);
      const url = "https://script.google.com/macros/s/AKfycbwnaxSZE8CP51nccfmPQrmeK29Rumnw-1HJgIdlC95Yy-YzSj6WN57eHpG_mLTvl3y8Bg/exec"; // Replace with your deployed Google Apps Script URL

      fetch(url, {
        method: 'POST',
        body: formData
      })
      .then(response => response.text())
      .then(orderCode => {
        document.getElementById('responseMessage').innerText = `Order submitted! Your code is: ${orderCode}`;
        document.getElementById('orderForm').reset();
      })
      .catch(error => {
        document.getElementById('responseMessage').innerText = 'Error submitting order. Please try again.';
        console.error(error);
      });
    });
  </script>
</body>
</html>
